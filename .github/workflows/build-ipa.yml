name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test on an available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | grep -E -m 1 'iPhone.*\([A-F0-9-]+\)' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')"
          test -n "$SIMULATOR_ID"
          xcodebuild test -project Mihwal.xcodeproj -scheme Mihwal -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Release app
        run: |
          xcodebuild build -project Mihwal.xcodeproj -scheme Mihwal -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Mihwal.app Payload/Mihwal.app
          ditto -c -k --sequesterRsrc --keepParent Payload Mihwal-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mihwal-unsigned-ipa
          path: Mihwal-unsigned.ipa
          if-no-files-found: error
