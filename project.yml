name: Mihwal
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Mihwal:
    type: application
    platform: iOS
    sources:
      - path: Mihwal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdullah.mihwal
        PRODUCT_NAME: Mihwal
        INFOPLIST_FILE: Mihwal/Resources/Info.plist
  MihwalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MihwalTests
    dependencies:
      - target: Mihwal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdullah.mihwal.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mihwal:
    build:
      targets:
        Mihwal: all
        MihwalTests: [test]
    test:
      targets:
        - MihwalTests
